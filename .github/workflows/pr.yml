name: Pull Requests

on:
  push:
    branches-ignore:
      - "main"
      - "master"
      - "development"
      - "releases/v*"
  pull_request:
    branches:
      - "releases/v*"
      - development
    # labeled: adding the run-inference-tests label runs the paid provider tests
    types: [opened, synchronize, reopened, labeled]

# Pushing to a PR branch fires both the push and pull_request triggers.
# Group them by branch so only one run is active, and cancel stale runs on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    # Another label must not run the whole suite again
    if: github.event.action != 'labeled' || github.event.label.name == 'run-inference-tests'
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    uses: ./.github/workflows/tests.yml
    with:
      # The paid providers run on a pull request only when it carries the run-inference-tests label
      paid_providers: ${{ github.event_name == 'pull_request' && contains( github.event.pull_request.labels.*.name, 'run-inference-tests' ) }}
    secrets: inherit

  # Format PR
  format_check:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-inference-tests'
    name: Checks Source Code Formatting
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Java formatting only, the same as the snapshot workflow. The CommandBox `format:check` step is gone:
      # box.json has no such script, and the action could not start (host JAVA_HOME inside its container).
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21

      - name: Verify Code Formatting
        run: ./gradlew spotlessCheck
